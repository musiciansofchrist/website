<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- GOOGLE SEARCH INDEXING ENGINE (SEO) -->
    <title>Musicians of Christ | Official Website & Music Ministry</title>
    <meta name="description" content="The official platform for Musicians of Christ. Explore faith-based music, scripture-focused worship releases, and updates from the ministry led by Jena Alvin.">
    <meta name="keywords" content="Musicians of Christ, Jena Alvin, Christian music group, gospel music, contemporary worship, contemporary Christian rap, faith-based media, sync licensing">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph for clean social media link previews -->
    <meta property="og:title" content="Musicians of Christ | Official Site">
    <meta property="og:description" content="Stream releases, worship music, and creative updates directly from the official ministry platform.">
    <meta property="og:type" content="website">

    <style>
        /* Modern, borderless layout reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(90deg, #e7dfd8, #808077, #c6c6c6);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }
        .portfolio-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        /* FIXED GLOBAL NAVIGATION LAYER - Sits perfectly over the header menu of every page */
        .global-nav-overlay {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 1200px;
            height: 75px; /* Fits exactly over the top heading text row */
            display: flex;
            justify-content: flex-end; 
            align-items: center;
            padding-right: 3%;
            z-index: 100;
            background: rgba(255, 255, 255, 0); /* Completely clear invisible buttons */
        }
        .nav-link-hotspot {
            height: 45px;
            margin-left: 15px;
            cursor: pointer;
            display: inline-block;
            background: rgba(255, 255, 255, 0); 
            width: 75px; 
        }
        .width-founder { width: 145px; }
        .width-sync { width: 135px; }

        /* MULTI-PAGE CONTROLLER */
        .canva-page-view {
            width: 100%;
            position: relative;
            display: none; /* Hides all pages by default to prevent overlapping long scrolling */
        }
        .active-page {
            display: block !important; /* Only shows the single selected active layout */
        }
        .canva-page-view img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Dynamic Streaming Stores Button Overlay Grid */
        .music-stores-overlay {
            position: absolute;
            bottom: 12%; 
            left: 50%;
            transform: translateX(-50%);
            width: 70%; 
            height: 9%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0);
            z-index: 5;
        }
        .store-btn {
            width: 22%; 
            height: 100%;
            cursor: pointer;
            display: inline-block;
            background: rgba(255, 255, 255, 0);
        }

        /* Direct Click-to-Email Hotspot Wrapper for Sync Page */
        .sync-email-hotspot {
            position: absolute;
            top: 25%;
            left: 10%;
            width: 80%;
            height: 50%;
            cursor: pointer;
            background: rgba(255, 255, 255, 0);
            display: block;
            z-index: 5;
        }

        /* Footer Layer Configurations for Contact Page */
        .footer-action-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
        }
        .email-card-hotspot {
            position: absolute;
            top: 20%;
            left: 15%;
            width: 70%;
            height: 40%;
            cursor: pointer;
            background: rgba(255, 255, 255, 0);
            display: block;
        }
        .socials-row-hotspot {
            position: absolute;
            bottom: 15%; 
            left: 50%;
            transform: translateX(-50%);
            width: 50%; 
            height: 12%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0);
        }
        .social-btn {
            width: 16%; 
            height: 100%;
            cursor: pointer;
            display: inline-block;
            background: rgba(255, 255, 255, 0);
            border-radius: 50%; 
        }
        
        /* Hides structural text layers from human view while leaving them fully readable for Google's indexing bots */
        .seo-shadow-text {
            position: absolute !important;
            width: 1px !important;
            height: 1px !important;
            padding: 0 !important;
            margin: -1px !important;
            overflow: hidden !important;
            clip: rect(0, 0, 0, 0) !important;
            white-space: nowrap !important;
            border: 0 !important;
        }
    </style>
</head>
<body>

    <!-- Invisible Fixed Header Click Layer sitting over all pages -->
    <nav class="global-nav-overlay">
        <div class="nav-link-hotspot" onclick="switchPage('home_page')" title="Home"></div>
        <div class="nav-link-hotspot" onclick="switchPage('about_page')" title="About"></div>
        <div class="nav-link-hotspot width-founder" onclick="switchPage('founder_page')" title="Meet the Founder"></div>
        <div class="nav-link-hotspot" onclick="switchPage('music_page')" title="Music Releases"></div>
        <div class="nav-link-hotspot width-sync" onclick="switchPage('sync_page')" title="Sync & Music Licensing"></div>
        <div class="nav-link-hotspot" onclick="switchPage('contact_page')" title="Get in Touch"></div>
    </nav>

    <!-- Main visual layout container -->
    <main class="portfolio-container">

        <!-- PAGE 1: HOME (Loads first automatically) -->
        <div id="home_page" class="canva-page-view active-page">
            <h1 class="seo-shadow-text">Musicians of Christ - Official Music Ministry Platform</h1>
            <p class="seo-shadow-text">Welcome to the official platform for Musicians of Christ, led by Jena Alvin.</p>
            <img src="HOME.png" alt="Musicians of Christ Cover Splash Layout Area">
        </div>

        <!-- PAGE 2: ABOUT -->
        <div id="about_page" class="canva-page-view">
            <h2 class="seo-shadow-text">About Musicians of Christ</h2>
            <img src="ABOUT.png" alt="About Musicians of Christ">
        </div>

        <!-- PAGE 3: FOUNDER & LEADER -->
        <div id="founder_page" class="canva-page-view">
            <h2 class="seo-shadow-text">Founder & Leader - Jena Alvin</h2>
            <img src="FOUNDER%20&%20LEADER.png" alt="Musicians of Christ Founder & Leader Section">
        </div>

        <!-- PAGE 4: MUSIC & ALBUM STORES -->
        <div id="music_page" class="canva-page-view">
            <h2 class="seo-shadow-text">Music Releases, Contemporary Worship, and Discography</h2>
            <div class="music-stores-overlay">
                <a href="https://spotify.com" target="_blank" class="store-btn" title="Stream on Spotify"></a>
                <a href="https://apple.com" target="_blank" class="store-btn" title="Listen on Apple Music"></a>
                <a href="https://youtube.com" target="_blank" class="store-btn" title="Watch on YouTube Music"></a>
                <a href="https://amazon.com" target="_blank" class="store-btn" title="Listen on Amazon Music"></a>
            </div>
            <img src="MUSIC.png" alt="Musicians of Christ Music Showcase Section">
        </div>

        <!-- PAGE 5: SYNC & LICENSING -->
        <div id="sync_page" class="canva-page-view">
            <h2 class="seo-shadow-text">Music Sync & licensing</h2>
            <a href="mailto:musiciansofchrist@://yahoo.com" class="sync-email-hotspot" title="Request Licensing Quote"></a>
            <img src="SYNC%20&%20LICENSING.png" alt="Music Sync & Licensing Info Section">
        </div>

        <!-- PAGE 6: CONTACT -->
        <div id="contact_page" class="canva-page-view">
            <h2 class="seo-shadow-text">Contact Musicians of Christ</h2>
            <div class="footer-action-layer">
                <a href="mailto:musiciansofchrist@://yahoo.com" class="email-card-hotspot" title="Email Musicians of Christ"></a>
                <div class="socials-row-hotspot">
                    <a href="https://tiktok.com" target="_blank" class="social-btn" title="TikTok"></a>
                    <a href="https://linkedin.com" target="_blank" class="social-btn" title="LinkedIn"></a>
                    <a href="https://instagram.com" target="_blank" class="social-btn" title="Instagram"></a>
