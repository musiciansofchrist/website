<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- GOOGLE SEARCH INDEXING ENGINE (SEO) -->
    <title>Musicians of Christ | Official Website & Music Ministry</title>
    <meta name="description" content="The official platform for Musicians of Christ. Explore faith-based music, scripture-focused worship releases, and updates from the ministry led by Jena Alvin.">
    <meta name="keywords" content="Musicians of Christ, Jena Alvin, Christian music group, gospel music, contemporary worship, contemporary Christian rap, faith-based media, sync licensing">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph for clean social media link previews -->
    <meta property="og:title" content="Musicians of Christ | Official Site">
    <meta property="og:description" content="Stream releases, worship music, and creative updates directly from the official ministry platform.">
    <meta property="og:type" content="website">

    <style>
        /* Modern, borderless layout reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth; /* Enables elegant, smooth scrolling when headings are clicked */
        }
        body {
            background: linear-gradient(90deg, #e7dfd8, #808077, #c6c6c6);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }
        .portfolio-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .canva-section {
            width: 100%;
            position: relative;
            display: block;
        }
        .canva-section img {
            width: 100%;
            height: auto;
            display: block; /* Removes the tiny default spacing gap under web images */
        }
        
        /* HEADER INTERACTIVE HOTSPOT NAVIGATION ROW */
        .nav-overlay-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8%; /* Covers your header navigation banner area height dynamically */
            display: flex;
            justify-content: flex-end; 
            align-items: center;
            padding-right: 4%;
            z-index: 10;
        }
        .nav-link-hotspot {
            height: 40px;
            margin-left: 20px;
            cursor: pointer;
            display: inline-block;
            background: rgba(255, 255, 255, 0); 
            text-decoration: none;
            width: 70px; 
        }
        .width-founder { width: 140px; }
        .width-sync { width: 130px; }

        /* Dynamic Streaming Stores Button Overlay Grid */
        .music-stores-overlay {
            position: absolute;
            bottom: 12%; 
            left: 50%;
            transform: translateX(-50%);
            width: 70%; 
            height: 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0);
            z-index: 5;
        }
        .store-btn {
            width: 22%; 
            height: 100%;
            cursor: pointer;
            display: inline-block;
            background: rgba(255, 255, 255, 0);
        }

        /* Direct Click-to-Email Hotspot Wrapper for Sync Page */
        .sync-email-hotspot {
            position: absolute;
            top: 20%;
            left: 5%;
            width: 90%;
            height: 60%;
            cursor: pointer;
            background: rgba(255, 255, 255, 0);
            display: block;
            z-index: 5;
        }

        /* Footer Layer Configurations for Contact Page Buttons */
        .footer-action-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
        }
        .email-card-hotspot {
            position: absolute;
            top: 15%;
            left: 10%;
            width: 80%;
            height: 45%;
            cursor: pointer;
            background: rgba(255, 255, 255, 0);
            display: block;
        }
        .socials-row-hotspot {
            position: absolute;
            bottom: 15%; 
            left: 50%;
            transform: translateX(-50%);
            width: 50%; 
            height: 12%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0);
        }
        .social-btn {
            width: 16%; 
            height: 100%;
            cursor: pointer;
            display: inline-block;
            background: rgba(255, 255, 255, 0);
            border-radius: 50%; 
        }
        
        /* Hides structural text layers from human view while leaving them fully readable for Google's indexing bots */
        .seo-shadow-text {
            position: absolute !important;
            width: 1px !important;
            height: 1px !important;
            padding: 0 !important;
            margin: -1px !important;
            overflow: hidden !important;
            clip: rect(0, 0, 0, 0) !important;
            white-space: nowrap !important;
            border: 0 !important;
        }
    </style>
</head>
<body>

    <!-- Main visual layout container -->
    <main class="portfolio-container">

        <!-- SECTION 1: HOME (Includes your master top navigation overlay menu) -->
        <section id="home" class="canva-section">
            <h1 class="seo-shadow-text">Musicians of Christ - Official Music Ministry Platform</h1>
            <p class="seo-shadow-text">Welcome to the official platform for Musicians of Christ, led by Jena Alvin.</p>
            
            <!-- Transparent Invisible Navigation Overlay Layer Mapping -->
            <div class="nav-overlay-container">
                <a href="#home" class="nav-link-hotspot" title="Home"></a>
                <a href="#about" class="nav-link-hotspot" title="About"></a>
                <a href="#founder" class="nav-link-hotspot width-founder" title="Meet the Founder"></a>
                <a href="#music" class="nav-link-hotspot" title="Music Releases"></a>
                <a href="#sync" class="nav-link-hotspot width-sync" title="Sync & Music Licensing"></a>
                <a href="#contact" class="nav-link-hotspot" title="Get in Touch"></a>
            </div>
            
            <img src="HOME.png" alt="Musicians of Christ Official Landing Layout Cover">
        </section>

        <!-- SECTION 2: ABOUT -->
        <section id="about" class="canva-section">
            <h2 class="seo-shadow-text">About Musicians of Christ</h2>
            <img src="ABOUT.png" alt="About Musicians of Christ">
        </section>

        <!-- SECTION 3: FOUNDER & LEADER -->
        <section id="founder" class="canva-section">
            <h2 class="seo-shadow-text">Founder & Leader - Jena Alvin</h2>
            <img src="FOUNDER%20&%20LEADER.png" alt="Musicians of Christ Founder & Leader Section">
        </section>

        <!-- SECTION 4: MUSIC & ALBUM STORES -->
        <section id="music" class="canva-section">
            <h2 class="seo-shadow-text">Music Releases, Contemporary Worship, and Discography</h2>
            
            <!-- Side-by-side active button hotspots over your music streaming icons -->
            <div class="music-stores-overlay">
                <a href="https://spotify.com" target="_blank" class="store-btn" title="Stream on Spotify"></a>
                <a href="https://apple.com" target="_blank" class="store-btn" title="Listen on Apple Music"></a>
                <a href="https://youtube.com" target="_blank" class="store-btn" title="Watch on YouTube Music"></a>
                <a href="https://amazon.com" target="_blank" class="store-btn" title="Listen on Amazon Music"></a>
            </div>
            
            <img src="MUSIC.png" alt="Musicians of Christ Music Showcase Section">
        </section>

        <!-- SECTION 5: SYNC & LICENSING -->
        <section id="sync" class="canva-section">
            <h2 class="seo-shadow-text">Music Sync & licensing</h2>
            
            <!-- Direct email hotspot covering the sync description text card space -->
            <a href="mailto:musiciansofchrist@://yahoo.com" class="sync-email-hotspot" title="Request Licensing Quote"></a>
            
            <img src="SYNC%20&%20LICENSING.png" alt="Music Sync & Licensing Info Section">
        </section>

        <!-- SECTION 6: CONTACT & SOCIAL FOOTER -->
        <section id="contact" class="canva-section">
            <h2 class="seo-shadow-text">Contact Musicians of Christ</h2>
            
            <div class="footer-action-layer">
                <!-- Action 1: Tap to Email -->
                <a href="mailto:musiciansofchrist@://yahoo.com" class="email-card-hotspot" title="Email Musicians of Christ"></a>
                
                <!-- Action 2: Social Links Overlay Router (Tied precisely over your graphic circular buttons) -->
                <div class="socials-row-hotspot">
                    <a href="https://tiktok.com" target="_blank" class="social-btn" title="TikTok"></a>
